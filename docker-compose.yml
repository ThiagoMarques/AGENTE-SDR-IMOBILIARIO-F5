services:
  db:
    image: postgres:16-alpine
    container_name: sdr-postgres
    environment:
      POSTGRES_USER: sdr
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr
    ports:
      - "5432:5432"
    volumes:
      - sdr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sdr_pgdata:
